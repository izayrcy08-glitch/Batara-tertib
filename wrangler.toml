# Cloudflare Workers + static assets (model terkini)
# Build: npm run build  →  apps/warga/dist (termasuk /pom)
# Deploy: npx wrangler deploy

name = "batara-tertib"
compatibility_date = "2026-08-21"

[assets]
directory = "./apps/warga/dist"
# Warga multi-halaman + /pom sebagai file statis (tanpa _redirects —
# aturan /pom/* → index.html ditolak Workers: infinite loop).
